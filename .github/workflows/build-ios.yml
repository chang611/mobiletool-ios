name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Xcode version
      run: xcodebuild -version
    
    - name: Build Archive
      run: |
        xcodebuild \
          -project "MobileTool.xcodeproj" \
          -scheme "MobileTool" \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -archivePath build/MobileTool.xcarchive \
          archive \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO
    
    - name: Package IPA
      run: |
        mkdir -p Payload
        cp -R build/MobileTool.xcarchive/Products/Applications/MobileTool.app Payload/
        zip -r mobile_tool.ipa Payload/
        ls -la mobile_tool.ipa
    
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: mobile_tool.ipa
        path: mobile_tool.ipa
        retention-days: 30
